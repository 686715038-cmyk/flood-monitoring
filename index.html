<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเฝ้าระวังระดับน้ำ - Flood Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🌊</span>
        <h1 class="text-xl font-bold">Flood Monitoring System</h1>
      </div>
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs text-slate-300">เชื่อมต่อสด Realtime</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Card 1: Banner สถานะหลัก -->
    <div id="status-card" class="rounded-2xl p-6 text-white shadow-lg transition-all duration-300 bg-slate-700">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
          <span class="text-sm uppercase tracking-wider opacity-80">สถานะปัจจุบัน</span>
          <h2 id="status-title" class="text-3xl font-bold mt-1">กำลังโหลดข้อมูล...</h2>
        </div>
        <div class="text-right">
          <p class="text-sm opacity-80">ระดับความเสี่ยง</p>
          <p id="status-level" class="text-4xl font-extrabold">-</p>
        </div>
      </div>
    </div>

    <!-- Cards แสดงค่าระดับน้ำ และระยะห่าง -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Card ระดับน้ำ -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-slate-500 text-sm font-medium">ระดับน้ำปัจจุบัน</span>
          <span class="text-blue-500 bg-blue-50 p-2 rounded-xl text-xl">📏</span>
        </div>
        <div class="mt-4">
          <span id="water-level" class="text-4xl font-bold text-slate-900">0.0</span>
          <span class="text-slate-500 font-medium ml-1">ซม.</span>
        </div>
      </div>

      <!-- Card ระยะห่างจากเซนเซอร์ -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-slate-500 text-sm font-medium">ระยะห่างเซนเซอร์</span>
          <span class="text-indigo-500 bg-indigo-50 p-2 rounded-xl text-xl">📡</span>
        </div>
        <div class="mt-4">
          <span id="distance" class="text-4xl font-bold text-slate-900">0.0</span>
          <span class="text-slate-500 font-medium ml-1">ซม.</span>
        </div>
      </div>

      <!-- Card เวลาอัปเดต -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-slate-500 text-sm font-medium">อัปเดตล่าสุด</span>
          <span class="text-emerald-500 bg-emerald-50 p-2 rounded-xl text-xl">⏱️</span>
        </div>
        <div class="mt-4">
          <span id="last-updated" class="text-lg font-semibold text-slate-700 block mt-2">-</span>
        </div>
      </div>

    </div>

    <!-- ประวัติรายการล่าสุด -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <span>📋</span> ประวัติการวัดล่าสุด (10 รายการล่าสุด)
        </h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 font-medium uppercase text-xs">
            <tr>
              <th class="px-6 py-3">ระยะเซนเซอร์</th>
              <th class="px-6 py-3">ระดับน้ำ</th>
              <th class="px-6 py-3">ระดับ</th>
              <th class="px-6 py-3">สถานะ</th>
            </tr>
          </thead>
          <tbody id="history-table" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="px-6 py-4 text-center text-slate-400">กำลังดึงข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://ruokmm-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const logsRef = query(ref(database, '/'), limitToLast(10));

    onValue(logsRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const items = Object.keys(data).map(key => ({
        id: key,
        ...data[key]
      })).reverse();

      const latest = items[0];

      if (latest) {
        const distance = latest.distance_cm || latest.distance || 0;
        const waterLevel = latest.water_level_cm || latest.waterLevel || 0;
        const levelState = latest.level_state || latest.level || 1;
        const statusText = latest.status_text || latest.status || "ปกติ";

        document.getElementById("distance").innerText = Number(distance).toFixed(1);
        document.getElementById("water-level").innerText = Number(waterLevel).toFixed(1);
        document.getElementById("status-level").innerText = "ระดับ " + levelState;
        document.getElementById("status-title").innerText = statusText;

        const now = new Date();
        document.getElementById("last-updated").innerText = now.toLocaleTimeString('th-TH') + " น.";

        const statusCard = document.getElementById("status-card");
        if (levelState === 3) {
          statusCard.className = "rounded-2xl p-6 text-white shadow-lg transition-all duration-300 bg-red-600";
        } else if (levelState === 2) {
          statusCard.className = "rounded-2xl p-6 text-white shadow-lg transition-all duration-300 bg-amber-500";
        } else {
          statusCard.className = "rounded-2xl p-6 text-white shadow-lg transition-all duration-300 bg-emerald-600";
        }

        const tableBody = document.getElementById("history-table");
        tableBody.innerHTML = "";

        items.forEach(item => {
          const d = item.distance_cm || item.distance || 0;
          const w = item.water_level_cm || item.waterLevel || 0;
          const l = item.level_state || item.level || 1;
          const s = item.status_text || item.status || "ปกติ";

          let badgeClass = "bg-emerald-100 text-emerald-800";
          if (l === 3) badgeClass = "bg-red-100 text-red-800";
          else if (l === 2) badgeClass = "bg-amber-100 text-amber-800";

          const row = `
            <tr class="hover:bg-slate-50 transition">
              <td class="px-6 py-4 font-medium">${Number(d).toFixed(1)} cm</td>
              <td class="px-6 py-4 font-semibold text-slate-800">${Number(w).toFixed(1)} cm</td>
              <td class="px-6 py-4">ระดับ ${l}</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                  ${s}
                </span>
              </td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      }
    });
  </script>
</body>
</html>
